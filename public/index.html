<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets content fill notch/home-indicator areas on newer iPads -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Patient Intake Form</title>

    <!-- PWA / Add to Home Screen (iPad & iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Intake Form" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3182ce" />

    <!-- Home-screen icon (place a 180×180 PNG at public/icons/icon-180.png) -->
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.json" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="form-container">
      <h1>Patient Intake Form</h1>

      <div class="app-meta">
        <p class="app-note">
          Install this app on an iPad, save drafts offline, and upload PDFs directly to Google Drive when internet access is available.
        </p>
        <div class="runtime-status" aria-live="polite">
          <span id="connection-status" class="status-pill">Checking connection…</span>
          <span id="queue-status" class="status-pill">Pending uploads: 0</span>
        </div>
      </div>

      <div id="status-message" class="status-message hidden"></div>

      <form id="intake-form" novalidate>
        <!-- Patient Information -->
        <section>
          <h2>Patient Information</h2>
          <div class="form-row">
            <label>
              Patient's Name:
              <input name="patient-name" required placeholder="Full name"
                autocomplete="name" autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              DOB:
              <input name="patient-dob" type="date" required autocomplete="bday" />
            </label>
          </div>

          <div class="form-row">
            <label>
              Sponsor's Name:
              <input name="sponsor-name" required placeholder="Full name"
                autocomplete="name" autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              SSN:
              <input
                name="ssn"
                required
                placeholder="XXX-XX-XXXX"
                pattern="\d{3}-?\d{2}-?\d{4}"
                maxlength="11"
                inputmode="numeric"
                autocomplete="off"
                autocorrect="off"
              />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              DSM-V Diagnosis and Severity Level:
              <input name="dsm" placeholder="Diagnosis and severity level"
                autocapitalize="sentences" autocorrect="on" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              Email:
              <input name="email" type="email" required placeholder="email@example.com"
                autocomplete="email" autocapitalize="none" autocorrect="off" />
            </label>
          </div>
        </section>

        <!-- Parent/Guardian Information -->
        <section>
          <h2>Parent / Guardian Information</h2>
          <div class="form-row">
            <label>
              Parent Name:
              <input name="parent-name" required placeholder="Full name"
                autocomplete="name" autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              DOB:
              <input name="parent-dob" type="date" required autocomplete="bday" />
            </label>
            <label>
              Age:
              <input name="parent-age" type="number" min="0" max="120" required placeholder="Age"
                inputmode="numeric" />
            </label>
          </div>
        </section>

        <!-- PCM Information -->
        <section>
          <h2>PCM Information</h2>
          <div class="form-row">
            <label>
              Referring Provider:
              <input name="reffering-provider" required placeholder="Provider name"
                autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              Date of Diagnosis:
              <input name="diagnosis-date" type="date" required />
            </label>
          </div>
        </section>

        <!-- Client's History -->
        <section>
          <h2>Client's History</h2>

          <div class="form-row">
            <label>
              Age:
              <input name="patient-age" type="number" min="0" max="120" required placeholder="Age"
                inputmode="numeric" />
            </label>
          </div>

          <div class="form-row">
            <label>
              Street Name:
              <input name="street-name" required placeholder="123 Main St"
                autocomplete="street-address" autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              City:
              <input name="city" required placeholder="City"
                autocomplete="address-level2" autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              State:
              <input name="state" required placeholder="ST" maxlength="2"
                autocomplete="address-level1" autocapitalize="characters" autocorrect="off" />
            </label>
            <label>
              Zip Code:
              <input
                name="zip-code"
                required
                placeholder="XXXXX"
                pattern="\d{5}(-\d{4})?"
                maxlength="10"
                inputmode="numeric"
                autocomplete="postal-code"
                autocorrect="off"
              />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              Siblings:
              <input name="sibling" required placeholder="Names and ages"
                autocapitalize="words" autocorrect="off" />
            </label>
          </div>

          <div class="form-row">
            <label>
              School:
              <input name="school" required placeholder="School name"
                autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              IEP:
              <input name="iep" required placeholder="Yes / No / Details"
                autocapitalize="sentences" autocorrect="off" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              Dual Diagnosis:
              <input name="dual-diag" required placeholder="Dual diagnosis details"
                autocapitalize="sentences" autocorrect="on" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width textarea-label">
              Family History:
              <textarea name="history" rows="4" placeholder="Relevant family history..."
                autocapitalize="sentences" autocorrect="on"></textarea>
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              Medications:
              <input name="medications" required placeholder="Current medications"
                autocapitalize="sentences" autocorrect="off" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width textarea-label">
              Allergies:
              <textarea name="allergies" required rows="3" placeholder="List allergies..."
                autocapitalize="sentences" autocorrect="on"></textarea>
            </label>
          </div>

          <div class="form-row">
            <label>
              Previous Services:
              <input name="services" required placeholder="Service type"
                autocapitalize="words" autocorrect="off" />
            </label>
            <label>
              Mo/Yr:
              <input name="date-of-services" placeholder="MM/YYYY"
                inputmode="numeric" autocorrect="off" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width textarea-label">
              Outcome of Prior Services:
              <textarea name="outcome" required rows="3" placeholder="Describe outcome..."
                autocapitalize="sentences" autocorrect="on"></textarea>
            </label>
          </div>

          <div class="form-row">
            <label>
              Additional Services: OT/PT/SLP
              <input name="additional-service" required placeholder="Service type(s)"
                autocapitalize="characters" autocorrect="off" />
            </label>
            <label>
              Hours Per Wk:
              <input name="hours" type="number" min="0" required placeholder="Hours"
                inputmode="decimal" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              Enrolled in Echo?:
              <input name="echo" placeholder="Yes / No"
                autocapitalize="none" autocorrect="off" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              CCP by ASN:
              <input name="asn" placeholder="Yes / No / Details"
                autocapitalize="none" autocorrect="off" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width">
              Days of Additional Services:
              <input name="additional-days" required placeholder="e.g. Mon, Wed, Fri"
                autocapitalize="words" autocorrect="off" />
            </label>
          </div>

          <div class="form-row">
            <label class="full-width textarea-label">
              Concerns:
              <textarea name="concerns" required rows="4" placeholder="Primary concerns..."
                autocapitalize="sentences" autocorrect="on"></textarea>
            </label>
          </div>

          <div class="form-row">
            <label class="full-width textarea-label">
              Goals:
              <textarea name="goals" required rows="4" placeholder="Treatment goals..."
                autocapitalize="sentences" autocorrect="on"></textarea>
            </label>
          </div>

          <div class="form-row">
            <label class="full-width textarea-label">
              End Result:
              <textarea name="end-result" required rows="4" placeholder="Desired end result..."
                autocapitalize="sentences" autocorrect="on"></textarea>
            </label>
          </div>
        </section>

        <div class="form-actions">
          <button type="button" id="save-draft-btn" class="secondary-button">Save Draft</button>
          <button type="button" id="sync-queue-btn" class="secondary-button">Sync Pending Uploads</button>
          <button type="submit" id="submit-btn">Create PDF &amp; Upload to Google Drive</button>
        </div>
      </form>
    </div>

    <script src="app-config.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="form.js"></script>
  </body>
</html>
